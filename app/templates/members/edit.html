{% extends "members/create.html" %}
{% block title %}Edit {{ member.full_name }}{% endblock %}
{% block page_title %}Edit Member{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Edit Member — {{ member.full_name }}</div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">First Name *</label><input type="text" name="first_name" class="form-control" value="{{ member.first_name }}" required></div>
                        <div class="col-md-4"><label class="form-label">Middle Name</label><input type="text" name="middle_name" class="form-control" value="{{ member.middle_name or '' }}"></div>
                        <div class="col-md-4"><label class="form-label">Last Name *</label><input type="text" name="last_name" class="form-control" value="{{ member.last_name }}" required></div>
                        <div class="col-md-4"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">Select</option><option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option><option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option></select></div>
                        <div class="col-md-4"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ member.email or '' }}"></div>
                        <div class="col-md-4"><label class="form-label">Phone</label><input type="tel" name="phone" class="form-control" value="{{ member.phone or '' }}"></div>
                        <div class="col-md-8"><label class="form-label">Address</label><input type="text" name="address" class="form-control" value="{{ member.address or '' }}"></div>
                        <div class="col-md-4"><label class="form-label">City</label><input type="text" name="city" class="form-control" value="{{ member.city or '' }}"></div>
                        <div class="col-md-4"><label class="form-label">Status</label><select name="membership_status" class="form-select"><option value="active" {% if member.membership_status == 'active' %}selected{% endif %}>Active</option><option value="inactive" {% if member.membership_status == 'inactive' %}selected{% endif %}>Inactive</option></select></div>
                        <div class="col-12"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3">{{ member.notes or '' }}</textarea></div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{{ url_for('members.view', id=member.id) }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
