{% extends "base.html" %}
{% block title %}Register Member{% endblock %}
{% block page_title %}Register New Member{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">Member Registration Form</div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">First Name *</label>
                            <input type="text" name="first_name" class="form-control" required value="{{ request.form.get('first_name', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Middle Name</label>
                            <input type="text" name="middle_name" class="form-control" value="{{ request.form.get('middle_name', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Last Name *</label>
                            <input type="text" name="last_name" class="form-control" required value="{{ request.form.get('last_name', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select">
                                <option value="">Select</option>
                                <option value="Male" {% if request.form.get('gender') == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if request.form.get('gender') == 'Female' %}selected{% endif %}>Female</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" name="date_of_birth" class="form-control" value="{{ request.form.get('date_of_birth', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Marital Status</label>
                            <select name="marital_status" class="form-select">
                                <option value="">Select</option>
                                <option value="Single" {% if request.form.get('marital_status') == 'Single' %}selected{% endif %}>Single</option>
                                <option value="Married" {% if request.form.get('marital_status') == 'Married' %}selected{% endif %}>Married</option>
                                <option value="Widowed" {% if request.form.get('marital_status') == 'Widowed' %}selected{% endif %}>Widowed</option>
                                <option value="Divorced" {% if request.form.get('marital_status') == 'Divorced' %}selected{% endif %}>Divorced</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ request.form.get('email', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone <span class="text-danger">*</span></label>
                            <input type="tel" name="phone" class="form-control" required value="{{ request.form.get('phone', '') }}">
                            <small class="text-muted">Used for church SMS updates.</small>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-control" value="{{ request.form.get('address', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">City</label>
                            <input type="text" name="city" class="form-control" value="{{ request.form.get('city', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Occupation</label>
                            <input type="text" name="occupation" class="form-control" value="{{ request.form.get('occupation', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Baptism Date</label>
                            <input type="date" name="baptism_date" class="form-control" value="{{ request.form.get('baptism_date', '') }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Baptism Place</label>
                            <input type="text" name="baptism_place" class="form-control" value="{{ request.form.get('baptism_place', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Photo</label>
                            <input type="file" name="photo" class="form-control" accept="image/*">
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Register</button>
                        <a href="{{ url_for('members.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
