{% extends "base.html" %}
{% block title %}Check-In{% endblock %}
{% block page_title %}Attendance Check-In{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="alert alert-info d-flex justify-content-between align-items-center">
            <span><i class="fas fa-qrcode me-2"></i>Prefer scanning? Use the QR station.</span>
            <a href="{{ url_for('attendance.scanner') }}" class="btn btn-sm btn-success">Open Scanner</a>
        </div>
        <div class="card">
            <div class="card-header"><i class="fas fa-clipboard-check me-2"></i>Manual Check-In</div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="member_id" id="member_id">
                    <div class="mb-3">
                        <label class="form-label">Search Member</label>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="member-search" class="form-control" placeholder="Type name or membership ID..." autocomplete="off">
                        </div>
                        <div id="search-results" style="display:none;"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Service Type</label>
                        <select name="attendance_type_id" class="form-select" required>
                            {% for t in types %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" value="{{ now().strftime('%Y-%m-%d') if false else '' }}">
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-check me-1"></i> Check In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>document.querySelector('[name="date"]').value = new Date().toISOString().split('T')[0];</script>
{% endblock %}
